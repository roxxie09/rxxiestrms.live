  .ch {
    display: flex;

  .ch:hover, .ch:focus-visible { background: #1b2230; border-color: rgba(77, 163, 255, 0.55); color: #fff; outline: none; }
  .ch-icon { flex: 0 0 44px; width: 44px; height: 44px; border-radius: 8px; object-fit: contain; background: #0d0d0d; }
  .ch-badge { display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.15rem; color: #fff; }
  .ch-name { flex: 1; min-width: 0; font-size: 1.05rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch-link {
    flex: 0 0 auto;
    padding: 6px 14px;
    border-radius: 999px;
    color: #4da3ff;
    font-weight: 600;
    background: rgba(77, 163, 255, 0.12);
    border: 1px solid rgba(77, 163, 255, 0.5);
    white-space: nowrap;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  }
  .ch:hover .ch-link, .ch:focus-visible .ch-link {
    color: #fff;
    background: #2f80ff;
    border-color: #2f80ff;
    box-shadow: 0 0 0 3px rgba(47, 128, 255, 0.28);

  .hub-msg { color: #9a9a9a; padding: 18px 4px; margin: 0; }
  .hub-msg:empty { display: none; }
  @media (max-width: 576px) {
    .hub { margin-top: 16px; }
    .hub-head { flex-direction: column; align-items: stretch; }
    #hubSearch { max-width: none; }
    .ch { gap: 10px; padding: 9px 10px; }

<script>
  // ===== 24/7 hub settings (edit these) =====
  // Names and hiding are easiest in the EPG logo dashboard (/epg-admin/ on roxiestreams.info):
  // a name set there wins over NAMES here, and channels hidden there are left off too.
  // Nicer names. Channels not listed here show their file name (tsn -> TSN, peacock -> Peacock).
  var NAMES = {
    skytopevent: 'Sky Sport Top Event'
  };
  // /raw/ pages to leave off the list. Files whose names start with _ are always left off.
  var HIDE = ['hls', 'switch-test'];
  // Logos come from the EPG logo dashboard (/epg-admin/ on roxiestreams.info).
  // Your own file wins over those: put <name>.png in /imgs/channels/ on roxiestreams.info
  // (the other domains get a copy within the hour). To point a channel at any other image,
  // list it here (this wins over everything). Channels with no logo get a letter.
  var ICONS = {
    // tsn: '/imgs/channels/tsn-logo.svg'
  };

  // ===== the list (no need to edit below) =====
  (function () {
    var list = document.getElementById('chList');
    var msg = document.getElementById('hubMsg');
    var search = document.getElementById('hubSearch');
    var AUTO = null;   // logos.json from the EPG logo dashboard (null if it isn't set up here)

    function niceName(n) {
      if (AUTO && AUTO.names && typeof AUTO.names[n] === 'string') return AUTO.names[n];
      if (NAMES[n]) return NAMES[n];
      if (AUTO && AUTO.titles && typeof AUTO.titles[n] === 'string') return AUTO.titles[n];
      if (/^[a-z]{2,4}$/i.test(n)) return n.toUpperCase();
      return n.replace(/[-_]+/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    }

    function badgeColor(n) {
      var h = 0;
      for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 360;
      return 'hsl(' + h + ', 45%, 32%)';
    }

    function makeBadge(n) {
      var b = document.createElement('span');
      b.className = 'ch-icon ch-badge';
      b.setAttribute('aria-hidden', 'true');
      b.textContent = niceName(n).charAt(0).toUpperCase();
      b.style.background = badgeColor(n);
      return b;
    }

    // Where to look for a channel's logo, best first
    function logoSources(n) {
      var list = [];
      if (ICONS[n]) list.push(ICONS[n]);
      if (AUTO) {
        if (AUTO.logos && typeof AUTO.logos[n] === 'string') list.push(AUTO.logos[n]);
      } else {
        list.push('/imgs/channels/' + n + '.png');
      }
      return list;
    }

    function makeIcon(n) {
      var srcs = logoSources(n);
      if (!srcs.length) return makeBadge(n);
      var i = 0;
      var img = document.createElement('img');
      img.className = 'ch-icon';
      img.alt = '';
      img.loading = 'lazy';
      img.src = srcs[0];
      img.onerror = function () {
        i++;
        if (i < srcs.length) img.src = srcs[i];
        else img.replaceWith(makeBadge(n));
      };
      return img;
    }

    function makeRow(n) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.className = 'ch';
      a.href = '/247/' + n;
      a.dataset.search = (niceName(n) + ' ' + n).toLowerCase();

      var img = makeIcon(n);

      var name = document.createElement('span');
      name.className = 'ch-name';
      name.textContent = niceName(n);

      var go = document.createElement('span');
      go.className = 'ch-link';
      go.textContent = 'Watch ▸';

      a.append(img, name, go);
      li.appendChild(a);
      return li;
    }

    function applySearch() {
      var q = search.value.trim().toLowerCase();
      var shown = 0;
      list.querySelectorAll('li').forEach(function (li) {
        var hit = !q || li.firstChild.dataset.search.indexOf(q) !== -1;
        li.hidden = !hit;
        if (hit) shown++;
      });
      if (list.children.length) msg.textContent = shown ? '' : 'No channels match "' + search.value.trim() + '".';
    }

    // Logos and names published by the EPG logo dashboard (fine if it's missing)
    var autoReq = fetch('/imgs/channels/auto/logos.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });

    // The channel list comes straight from the /raw/ folder
    fetch('/raw/', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (files) {
        return autoReq.then(function (auto) {
          if (auto && typeof auto === 'object' && auto.logos && typeof auto.logos === 'object') AUTO = auto;
          return files;
        });
      })
      .then(function (files) {
        var names = files
          .filter(function (f) { return f.type === 'file' && /\.html$/i.test(f.name); })
          .map(function (f) { return f.name.replace(/\.html$/i, ''); })
          .filter(function (n) {
            var hiddenInDashboard = AUTO && Array.isArray(AUTO.hidden) && AUTO.hidden.indexOf(n) !== -1;
            return /^[A-Za-z0-9-][A-Za-z0-9_-]*$/.test(n) && HIDE.indexOf(n) === -1 && !hiddenInDashboard;
          })
          .sort(function (a, b) { return niceName(a).localeCompare(niceName(b)); });
        names.forEach(function (n) { list.appendChild(makeRow(n)); });
        msg.textContent = names.length ? '' : 'No channels yet.';
        applySearch();
      })
      .catch(function () {
        msg.textContent = "Couldn't load the channel list. Try refreshing the page.";
      });

    search.addEventListener('input', applySearch);
  })();

  // Block right-click and the usual DevTools shortcuts
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'C', 'J'].includes(e.key))) e.preventDefault();
  });
</script>
