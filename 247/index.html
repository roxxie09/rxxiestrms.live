<style>

    color: pink;

  /* ---- 24/7 hub: a TV guide ---- */
  .hub { max-width: 1240px; margin: 24px auto 0; --chw: 300px; --row: 76px; }
  .hub-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .hub-head h1 { margin: 0; font-family: 'Kanit', sans-serif; font-size: 1.7rem; color: pink; }
  #hubSearch { max-width: 260px; }
  .hub-msg { color: #9a9a9a; padding: 18px 4px; margin: 0; }
  .hub-msg:empty { display: none; }

  .tg-info, .tg-info *, .tg, .tg * { box-sizing: border-box; }
  /* what's selected, on top */
  .tg-info { display: flex; gap: 16px; align-items: flex-start; min-height: 136px; padding: 14px 16px; margin-bottom: 10px;
    border-radius: 10px; background: #161616; border: 1px solid rgba(255, 255, 255, 0.07); }
  .tg-info[hidden] { display: none; }
  .tg-pic { flex: 0 0 160px; }
  .tg-pic .ch-icon { width: 160px; height: 90px; flex-basis: 160px; padding: 6px 8px; }
  .tg-text { flex: 1; min-width: 0; }
  .tg-title { font-family: 'Kanit', sans-serif; font-size: 1.4rem; line-height: 1.2; color: #fff; }
  .tg-sub { color: #cfcfcf; margin-top: 2px; }
  .tg-meta { color: #9a9a9a; font-size: 0.9rem; margin-top: 4px; }
  .tg-bar { height: 3px; max-width: 260px; margin-top: 7px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
  .tg-bar span { display: block; height: 100%; background: pink; }
  .tg-tags { margin-top: 7px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tg-tag { padding: 0 8px; border-radius: 999px; font-size: 0.72rem; line-height: 1.6; color: #9a9a9a; border: 1px solid rgba(255, 255, 255, 0.15); }
  .tg-tag.live { color: pink; border-color: rgba(255, 192, 203, 0.5); }
  .tg-tag.new { color: #4da3ff; border-color: rgba(77, 163, 255, 0.5); }
  .tg-desc { color: #cfcfcf; font-size: 0.92rem; margin: 8px 0 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ch-link {
    flex: 0 0 auto;
    padding: 6px 14px;
    border-radius: 999px;
    color: #4da3ff;
    font-weight: 600;
    background: rgba(77, 163, 255, 0.12);
    border: 1px solid rgba(77, 163, 255, 0.5);
    white-space: nowrap;
    text-decoration: none;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  }
  .ch-link:hover, .ch-link:focus-visible {
    color: #fff;
    background: #2f80ff;
    border-color: #2f80ff;
    box-shadow: 0 0 0 3px rgba(47, 128, 255, 0.28);
    outline: none;
  }

  /* the grid: channels down the left, shows along the time line */
  .tg { position: relative; height: 70vh; min-height: 380px; overflow: auto; border-radius: 10px; background: #0f0f0f;
    border: 1px solid rgba(255, 255, 255, 0.07); overscroll-behavior: contain; }
  .tg-inner { position: relative; min-width: 100%; }
  .tg-head { position: sticky; top: 0; z-index: 4; display: flex; height: 34px; background: #121212;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
  .tg-corner { position: sticky; left: 0; z-index: 5; flex: 0 0 var(--chw); width: var(--chw); padding: 7px 14px; background: #121212;
    color: pink; font-weight: 600; font-size: 0.9rem; border: 0; text-align: left; cursor: pointer;
    border-right: 1px solid rgba(255, 255, 255, 0.08); }
  .tg-ruler { position: relative; flex: 0 0 auto; }
  .tg-tick { position: absolute; top: 0; bottom: 0; padding: 8px 8px; font-size: 0.8rem; color: #9a9a9a; white-space: nowrap;
    border-left: 1px solid rgba(255, 255, 255, 0.12); }
  .tg-rows { list-style: none; margin: 0; padding: 0; }
  .tg-row { display: flex; height: var(--row); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
  .tg-row[hidden] { display: none; }
  a.ch { position: sticky; left: 0; z-index: 3; flex: 0 0 var(--chw); width: var(--chw); display: flex; align-items: center; gap: 12px;
    padding: 4px 12px; background: #161616; color: #fff; text-decoration: none; border-right: 1px solid rgba(255, 255, 255, 0.08);
    transition: background 0.15s; }
  a.ch:hover, a.ch:focus-visible { background: #1b2230; color: #fff; outline: none; }
  .ch-icon { box-sizing: border-box; flex: 0 0 120px; width: 120px; height: 68px; padding: 4px 6px; border-radius: 8px;
    object-fit: contain; background: #0d0d0d; }
  .ch-badge { display: flex; align-items: center; justify-content: center; padding: 0; font-weight: 700; font-size: 1.6rem; color: #fff;
    overflow: hidden; }
  .ch-badge .bn { display: none; }
  .ch-name { flex: 1; min-width: 0; font-size: 1.02rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tg-track { position: relative; flex: 0 0 auto; }
  .tg-cell { position: absolute; top: 4px; bottom: 4px; display: flex; flex-direction: column; justify-content: center; gap: 2px;
    padding: 4px 10px; border-radius: 6px; background: #1c1c1c; border: 1px solid rgba(255, 255, 255, 0.06); color: #e9e9e9;
    text-align: left; overflow: hidden; cursor: pointer; font: inherit; }
  .tg-cell .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tg-cell .w { font-size: 0.78rem; color: #9a9a9a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tg-cell.now { background-color: #1b2230; border-color: rgba(77, 163, 255, 0.35); color: #fff; }
  .tg-cell.past { opacity: 0.5; }
  .tg-cell.none { background: #141414; color: #6f6f6f; }
  .tg-cell.none .t { font-weight: 400; }
  .tg-cell:hover { border-color: #4da3ff; }
  .tg-cell.sel, .tg-cell:focus-visible { background: #2f80ff; border-color: #2f80ff; color: #fff; opacity: 1; outline: none; }
  .tg-cell.sel .w, .tg-cell:focus-visible .w { color: rgba(255, 255, 255, 0.85); }
  .tg-cell.none.sel, .tg-cell.none:focus-visible { background: #1b2230; border-color: #4da3ff; color: #cfcfcf; }
  .tg-mark { margin-right: 6px; font-size: 0.68rem; font-weight: 700; color: pink; }
  .tg-cell.sel .tg-mark { color: #fff; }
  .tg.dragging, .tg.dragging * { cursor: grabbing !important; user-select: none; }
  .tg-cell.hit { border-color: pink; box-shadow: inset 0 0 0 1px pink; }
  .tg-row.byshow .tg-cell:not(.hit) { opacity: 0.4; }
  .tg-auto { position: fixed; z-index: 50; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%;
    border: 2px solid pink; background: rgba(13, 13, 13, 0.85); pointer-events: none; }
  .tg-auto::after { content: ""; position: absolute; left: 9px; top: 9px; width: 4px; height: 4px; border-radius: 50%; background: pink; }
  .tg-now { position: absolute; top: 34px; bottom: 0; z-index: 2; width: 2px; margin-left: -1px; background: pink; opacity: 0.75; pointer-events: none; }
  .tg-now::before { content: ""; position: absolute; top: -4px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: pink; }

  @media (max-width: 576px) {
    .hub { margin-top: 16px; --chw: 100px; --row: 60px; }
    .hub-head { flex-direction: column; align-items: stretch; }
    #hubSearch { max-width: none; }
    .tg-info { gap: 8px 12px; min-height: 0; padding: 12px; flex-wrap: wrap; }
    .tg-pic { flex-basis: 88px; }
    .tg-text { flex: 1 1 calc(100% - 100px); }
    .tg-pic .ch-icon { width: 88px; height: 50px; flex-basis: 88px; padding: 3px 4px; }
    .tg-title { font-size: 1.15rem; }
    .tg-desc { -webkit-line-clamp: 2; font-size: 0.85rem; }
    .tg-info .ch-link { order: 3; margin-left: auto; }
    .tg { height: 62vh; }
    .tg-corner { padding: 7px 8px; font-size: 0.8rem; }
    a.ch { padding: 4px 6px; justify-content: center; }
    .ch-icon { flex-basis: 88px; width: 88px; height: 50px; padding: 3px 4px; }
    .ch-badge { font-size: 0.72rem; line-height: 1.15; text-align: center; padding: 2px 4px; }
    .ch-badge .bl { display: none; }
    .ch-badge .bn { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    a.ch .ch-name { display: none; }
    .tg-cell { padding: 3px 7px; }
    .tg-cell .w { font-size: 0.72rem; }
  }
</style>
</head>

<script>
  // ===== 24/7 hub settings (edit these) =====
  // Names and hiding are easiest in the EPG logo dashboard (/epg-admin/ on roxiestreams.info):
  // a name set there wins over NAMES here, and channels hidden there are left off too.
  // Nicer names. Channels not listed here show their file name (tsn -> TSN, peacock -> Peacock).
  var NAMES = {
    skytopevent: 'Sky Sport Top Event'
  };
  // /raw/ pages to leave off the list. Files whose names start with _ are always left off.
  var HIDE = ['hls', 'switch-test'];
  // Logos come from the EPG logo dashboard (/epg-admin/ on roxiestreams.info).
  // Your own file wins over those: put <name>.png in /imgs/channels/ on roxiestreams.info
  // (the other domains get a copy within the hour). To point a channel at any other image,
  // list it here (this wins over everything). Channels with no logo get a letter.
  // The TV guide (what's on) comes from the dashboard too (its EPG part).
  var ICONS = {
    // tsn: '/imgs/channels/tsn-logo.svg'
  };

  // ===== the guide (no need to edit below) =====
  (function () {
    var list = document.getElementById('chList');
    var grid = document.getElementById('tg');
    var inner = document.getElementById('tgInner');
    var ruler = document.getElementById('tgRuler');
    var nowLine = document.getElementById('tgNow');
    var clockBtn = document.getElementById('tgClock');
    var info = document.getElementById('tgInfo');
    var msg = document.getElementById('hubMsg');
    var search = document.getElementById('hubSearch');
    var AUTO = null;   // logos.json from the EPG logo dashboard (null if it isn't set up here)
    var EPG = {};      // epg.json: per channel, [start, stop, title, sub-title, description, tags] for each show
    var CHANNELS = []; // the channels shown, in order
    var T0 = 0, T1 = 0, PPM = 6;   // the time line: where it starts and ends, and pixels per minute
    var sel = null;    // the selected show: {name, start}; start null = a "No information" block
    var shown = null;  // what the panel on top shows right now (the selected show, or the one under the mouse)
    var canHover = !!(window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches);
    var phone = window.matchMedia ? window.matchMedia('(max-width: 576px)') : null;

    function niceName(n) {
      if (AUTO && AUTO.names && typeof AUTO.names[n] === 'string') return AUTO.names[n];
      if (NAMES[n]) return NAMES[n];
      if (AUTO && AUTO.titles && typeof AUTO.titles[n] === 'string') return AUTO.titles[n];
      if (/^[a-z]{2,4}$/i.test(n)) return n.toUpperCase();
      return n.replace(/[-_]+/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    }

    function badgeColor(n) {
      var h = 0;
      for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 360;
      return 'hsl(' + h + ', 45%, 32%)';
    }

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function makeBadge(n) {     // a letter (on phones: the name) for channels with no logo
      var b = el('span', 'ch-icon ch-badge');
      b.setAttribute('aria-hidden', 'true');
      b.append(el('span', 'bl', niceName(n).charAt(0).toUpperCase()), el('span', 'bn', niceName(n)));
      b.style.background = badgeColor(n);
      return b;
    }

    // Where to look for a channel's logo, best first
    function logoSources(n) {
      var list = [];
      if (ICONS[n]) list.push(ICONS[n]);
      if (AUTO) {
        if (AUTO.logos && typeof AUTO.logos[n] === 'string') list.push(AUTO.logos[n]);
      } else {
        list.push('/imgs/channels/' + n + '.png');
      }
      return list;
    }

    function makeIcon(n) {
      var srcs = logoSources(n);
      if (!srcs.length) return makeBadge(n);
      var i = 0;
      var img = el('img', 'ch-icon');
      img.alt = '';
      img.loading = 'lazy';
      img.src = srcs[0];
      img.onerror = function () {
        i++;
        if (i < srcs.length) img.src = srcs[i];
        else img.replaceWith(makeBadge(n));
      };
      return img;
    }

    // ---- shows
    function nowSec() { return Date.now() / 1000; }
    function clock(t) { return new Date(t * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
    function str(s, i) { return typeof s[i] === 'string' ? s[i] : ''; }
    function tagsOf(s) { return Array.isArray(s[5]) ? s[5].filter(function (x) { return typeof x === 'string'; }) : []; }
    function showsOf(n) {
      var l = EPG && Array.isArray(EPG[n]) ? EPG[n] : [];
      return l.filter(function (s) {
        return Array.isArray(s) && typeof s[0] === 'number' && typeof s[1] === 'number' && s[1] > s[0] && typeof s[2] === 'string';
      }).sort(function (a, b) { return a[0] - b[0]; });
    }
    function findShow(n, start) {
      if (start === null) return null;
      var l = showsOf(n);
      for (var i = 0; i < l.length; i++) if (l[i][0] === start) return l[i];
      return null;
    }
    function px(t) { return (t - T0) / 60 * PPM; }

    // ---- the time line and the rows
    function setRange() {
      var t = nowSec();
      PPM = phone && phone.matches ? 3.6 : 6;
      T0 = Math.floor(t / 1800) * 1800;      // from this half hour: the show that's on is cut at the left edge, title in view
      var end = T0 + 3 * 3600;
      CHANNELS.forEach(function (n) { showsOf(n).forEach(function (s) { if (s[1] > end) end = s[1]; }); });
      T1 = Math.ceil(Math.min(end, T0 + 13 * 3600) / 1800) * 1800;
    }

    function buildRuler() {
      var w = px(T1);
      ruler.textContent = '';
      ruler.style.width = w + 'px';
      for (var t = T0; t < T1; t += 1800) {
        var d = new Date(t * 1000);
        var tick = el('span', 'tg-tick', (d.getHours() === 0 && d.getMinutes() === 0 ?
          d.toLocaleDateString([], { weekday: 'short' }) + ' ' : '') + clock(t));
        tick.style.left = px(t) + 'px';
        ruler.appendChild(tick);
      }
      inner.style.width = 'calc(var(--chw) + ' + w + 'px)';
    }

    function cell(n, s, from, to) {
      var b = el('button', 'tg-cell' + (s ? '' : ' none'));
      b.type = 'button';
      b.dataset.name = n;
      b.dataset.start = s ? String(s[0]) : '';
      b.dataset.from = from;                    // where the block starts and ends on the time line
      b.dataset.to = to;
      b.dataset.s = s ? s[0] : from;            // when the show starts and ends
      b.dataset.e = s ? s[1] : to;
      b.dataset.x = px(from);
      b.dataset.w = Math.max(px(to) - px(from) - 3, 4);
      b.style.left = b.dataset.x + 'px';
      b.style.width = b.dataset.w + 'px';
      var t = el('span', 't');
      if (s) {
        var tags = tagsOf(s);
        var flag = tags.indexOf('Live') !== -1 ? 'LIVE' : tags.indexOf('New') !== -1 ? 'NEW' : '';
        if (flag) t.appendChild(el('span', 'tg-mark', flag));
      }
      t.appendChild(document.createTextNode(s ? s[2] : 'No information'));
      b.appendChild(t);
      if (s) b.appendChild(el('span', 'w', clock(s[0]) + ' – ' + clock(s[1])));
      b.setAttribute('aria-label', niceName(n) + ': ' + (s ? s[2] + ', ' + clock(s[0]) + ' to ' + clock(s[1]) : 'no information'));
      return b;
    }

    function buildTrack(n) {
      var track = el('div', 'tg-track');
      track.style.width = px(T1) + 'px';
      var at = T0;
      showsOf(n).forEach(function (s) {
        if (s[1] <= T0 || s[0] >= T1) return;
        var from = Math.max(s[0], at), to = Math.min(s[1], T1);
        if (to <= from) return;
        if (from - at >= 15 * 60) track.appendChild(cell(n, null, at, from));   // a gap in the listings
        track.appendChild(cell(n, s, from, to));
        at = to;
      });
      if (at === T0 || T1 - at >= 15 * 60) track.appendChild(cell(n, null, at, T1));
      return track;
    }

    function makeRow(n) {
      var li = el('li', 'tg-row');
      li.dataset.name = n;
      var a = el('a', 'ch');
      a.href = '/247/' + n;
      a.dataset.name = n;
      a.setAttribute('aria-label', 'Watch ' + niceName(n));
      a.append(makeIcon(n), el('span', 'ch-name', niceName(n)));
      li.append(a, buildTrack(n));
      return li;
    }

    // ---- the panel on top: the selected show (or the one under the mouse)
    var bar = null;
    function showInfo(n, start) {
      var key = n + '|' + start;
      if (shown === key) return;
      shown = key;
      var s = findShow(n, start), t = nowSec();
      var pic = el('div', 'tg-pic');
      pic.appendChild(makeIcon(n));
      var text = el('div', 'tg-text');
      text.appendChild(el('div', 'tg-title', s ? s[2] : niceName(n)));
      if (s && str(s, 3)) text.appendChild(el('div', 'tg-sub', str(s, 3)));
      text.appendChild(el('div', 'tg-meta', s ? clock(s[0]) + ' – ' + clock(s[1]) + ' · ' + Math.round((s[1] - s[0]) / 60) + ' min · ' + niceName(n)
        : 'No information'));
      bar = null;
      if (s && s[0] <= t && t < s[1]) {
        var b = el('div', 'tg-bar');
        bar = el('span');
        b.appendChild(bar);
        text.appendChild(b);
        bar.dataset.s = s[0];
        bar.dataset.e = s[1];
        moveBar();
      }
      var tags = s ? tagsOf(s) : [];
      if (tags.length) {
        var box = el('div', 'tg-tags');
        tags.forEach(function (x) { box.appendChild(el('span', 'tg-tag' + (x === 'Live' ? ' live' : x === 'New' ? ' new' : ''), x)); });
        text.appendChild(box);
      }
      if (s && str(s, 4)) text.appendChild(el('p', 'tg-desc', str(s, 4)));
      var go = el('a', 'ch-link', 'Watch ▸');
      go.href = '/247/' + n;
      info.textContent = '';
      info.append(pic, text, go);
      info.hidden = false;
    }
    function moveBar() {
      if (!bar) return;
      var s0 = +bar.dataset.s, s1 = +bar.dataset.e;
      bar.style.width = Math.max(0, Math.min(100, (nowSec() - s0) / (s1 - s0) * 100)) + '%';
    }

    function select(b) {
      var prev = list.querySelector('.tg-cell.sel');
      if (prev) prev.classList.remove('sel');
      b.classList.add('sel');
      sel = { name: b.dataset.name, start: b.dataset.start ? +b.dataset.start : null };
      showInfo(sel.name, sel.start);
    }

    // ---- what changes as time passes: the clock, the now line, what's on
    function tick() {
      var t = nowSec();
      clockBtn.textContent = clock(t);
      nowLine.hidden = t < T0 || t > T1;
      nowLine.style.left = 'calc(var(--chw) + ' + px(t) + 'px)';
      list.querySelectorAll('.tg-cell:not(.none)').forEach(function (b) {
        var on = +b.dataset.s <= t && t < +b.dataset.e, from = +b.dataset.from, to = +b.dataset.to;
        b.classList.toggle('now', on);
        b.classList.toggle('past', +b.dataset.e <= t);
        b.style.backgroundImage = on && to > from ? 'linear-gradient(90deg, rgba(255, 255, 255, 0.07) ' +
          Math.round(Math.max(0, Math.min(1, (t - from) / (to - from))) * 100) + '%, transparent 0)' : '';
      });
      moveBar();
    }

    // a show that started off to the left keeps its title in view (the block's left part is under the channel column)
    var pinQueued = false;
    function pinTitles() {
      pinQueued = false;
      var x = grid.scrollLeft;
      list.querySelectorAll('.tg-cell').forEach(function (b) {
        var left = +b.dataset.x, w = +b.dataset.w, pad = left < x && left + w > x + 60 ? x - left : 0;
        if ((b._pad || 0) !== pad) {
          b.style.paddingLeft = pad ? (pad + 10) + 'px' : '';
          b._pad = pad;
        }
      });
    }
    grid.addEventListener('scroll', function () {
      if (!pinQueued) {
        pinQueued = true;
        requestAnimationFrame(pinTitles);
      }
    }, { passive: true });

    // ---- search: each word typed starts a word of the channel's name or of a show (any order),
    // like the dashboard: 'sky top', 'main e', 'leafs', 'hockey live'
    var GENERIC = ['sport', 'sports', 'channel', 'tv', 'network', 'the', 'and'];
    function wordsOf(s) {
      var out = [];
      String(s).toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '').split(/[^\p{L}\p{N}]+/u).forEach(function (w) {
        if (w) out.push.apply(out, w.match(/\p{N}+|\p{L}+/gu) || []);
      });
      return out;
    }
    function typedMatch(typed, words) {
      var used = [], hit = 0;
      var ok = typed.every(function (w) {
        var i = words.findIndex(function (x, k) {
          return used.indexOf(k) === -1 && (x.indexOf(w) === 0 || (w.length > 3 && w.slice(-1) === 's' && x === w.slice(0, -1)));
        });
        if (i === -1) return GENERIC.indexOf(w) !== -1;
        used.push(i);
        hit++;
        return true;
      });
      return ok && hit > 0;
    }
    function showWords(s) {
      if (!s._w) s._w = wordsOf([s[2], str(s, 3), tagsOf(s).join(' '), str(s, 4)].join(' '));
      return s._w;
    }
    var lastQuery = '';
    function applySearch() {
      var q = search.value.trim(), typed = wordsOf(q), rows = 0, first = null, t = nowSec();
      list.querySelectorAll('li.tg-row').forEach(function (li) {
        var n = li.dataset.name;
        var byName = !q || (niceName(n) + ' ' + n).toLowerCase().indexOf(q.toLowerCase()) !== -1 ||
          (typed.length && typedMatch(typed, wordsOf(niceName(n) + ' ' + n)));
        var shows = 0;
        li.querySelectorAll('.tg-cell:not(.none)').forEach(function (b) {
          var s = q && typed.length ? findShow(n, +b.dataset.start) : null;
          var hit = !!s && s[1] > t && typedMatch(typed, showWords(s));
          b.classList.toggle('hit', hit);
          if (hit) {
            shows++;
            if (first === null || s[0] < first) first = s[0];
          }
        });
        li.hidden = !(byName || shows);
        li.classList.toggle('byshow', !byName && shows > 0);
        if (!li.hidden) rows++;
      });
      if (list.children.length) msg.textContent = rows ? '' : 'No channels or shows match "' + q + '".';
      if (q !== lastQuery && first !== null) {     // bring the first show found into view
        var x = px(Math.max(first, T0)), w = grid.clientWidth - inner.querySelector('.tg-corner').offsetWidth;
        if (x < grid.scrollLeft || x > grid.scrollLeft + w - 60) grid.scrollLeft = Math.max(0, x - 20);
      }
      lastQuery = q;
    }

    function render() {
      var first = !list.children.length, x = grid.scrollLeft, y = grid.scrollTop, oldT0 = T0;
      setRange();
      buildRuler();
      list.textContent = '';
      CHANNELS.forEach(function (n) { list.appendChild(makeRow(n)); });
      grid.hidden = !CHANNELS.length;
      tick();
      applySearch();
      if (first) grid.scrollLeft = 0;
      else {
        grid.scrollLeft = Math.max(0, x - (T0 - oldT0) / 60 * PPM);
        grid.scrollTop = y;
      }
      pinTitles();
      var b = null;           // keep the selection; to start with, what's on the first channel
      if (sel) {
        list.querySelectorAll('.tg-cell').forEach(function (c) {
          if (!b && c.dataset.name === sel.name && (sel.start === null ? !c.dataset.start : +c.dataset.start === sel.start)) b = c;
        });
      }
      if (!b) b = list.querySelector('li.tg-row:not([hidden]) .tg-cell.now');
      shown = null;
      if (b) select(b);
      else info.hidden = true;
    }

    list.addEventListener('click', function (e) {
      var b = e.target.closest('.tg-cell');
      if (!b) return;
      var t = nowSec(), on = +b.dataset.s <= t && t < +b.dataset.e;
      if ((canHover && on) || b.classList.contains('sel')) {      // what's on now, or a second tap: watch
        location.href = '/247/' + b.dataset.name;
        return;
      }
      select(b);
      if (info.getBoundingClientRect().top < 0) info.scrollIntoView({ block: 'start', behavior: 'smooth' });
    });
    list.addEventListener('focusin', function (e) {
      var b = e.target.closest('.tg-cell');
      if (b) showInfo(b.dataset.name, b.dataset.start ? +b.dataset.start : null);
    });
    if (canHover) {
      list.addEventListener('mouseover', function (e) {
        var b = e.target.closest('.tg-cell');
        if (b) showInfo(b.dataset.name, b.dataset.start ? +b.dataset.start : null);
      });
      grid.addEventListener('mouseleave', function () { if (sel) showInfo(sel.name, sel.start); });
    }
    // ---- mouse: drag the guide to move around it; a middle click scrolls it (like Windows: click, then point
    // where to go; or hold it and move); touch screens already scroll it with a finger
    var drag = null, dragged = false, auto = null;
    var autoMark = document.getElementById('tgAuto');
    grid.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'mouse') return;
      if (auto) {                       // any click ends middle-click scrolling
        stopAuto();
        e.preventDefault();
        if (e.button === 0) dragged = true;      // ...and isn't a click on what's under it
        return;
      }
      if (e.button === 1 && !e.target.closest('a')) {      // a middle click on a link still opens it in a new tab
        e.preventDefault();
        auto = { x: e.clientX, y: e.clientY, mx: e.clientX, my: e.clientY, moved: false };
        autoMark.style.left = e.clientX + 'px';
        autoMark.style.top = e.clientY + 'px';
        autoMark.hidden = false;
        requestAnimationFrame(autoStep);
        return;
      }
      if (e.button !== 0) return;
      e.preventDefault();               // no text selection or link dragging; clicks still work
      drag = { x: e.clientX, y: e.clientY, sl: grid.scrollLeft, st: grid.scrollTop, id: e.pointerId, moved: false };
    });
    window.addEventListener('pointermove', function (e) {
      if (auto) {
        auto.mx = e.clientX;
        auto.my = e.clientY;
        if (Math.abs(e.clientX - auto.x) + Math.abs(e.clientY - auto.y) > 12) auto.moved = true;
      }
      if (!drag || e.pointerId !== drag.id) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 6) return;
      if (!drag.moved) {
        drag.moved = true;
        grid.classList.add('dragging');
      }
      grid.scrollLeft = drag.sl - dx;
      grid.scrollTop = drag.st - dy;
    });
    function endDrag(e) {
      if (auto && e.button === 1 && auto.moved) stopAuto();     // held down and moved: stops when let go
      if (!drag || e.pointerId !== drag.id) return;
      if (drag.moved) {
        dragged = true;                 // the click that ends a drag isn't a click
        setTimeout(function () { dragged = false; }, 0);
      }
      drag = null;
      grid.classList.remove('dragging');
    }
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', function (e) { if (drag && e.pointerId === drag.id) { drag = null; grid.classList.remove('dragging'); } });
    grid.addEventListener('click', function (e) {
      if (dragged) {
        e.preventDefault();
        e.stopPropagation();
        dragged = false;
      }
    }, true);
    grid.addEventListener('dragstart', function (e) { e.preventDefault(); });
    function autoStep() {
      if (!auto) return;
      var dx = auto.mx - auto.x, dy = auto.my - auto.y, dead = 12;
      if (Math.abs(dx) > dead) grid.scrollLeft += (dx - (dx > 0 ? dead : -dead)) / 5;
      if (Math.abs(dy) > dead) grid.scrollTop += (dy - (dy > 0 ? dead : -dead)) / 5;
      requestAnimationFrame(autoStep);
    }
    function stopAuto() {
      auto = null;
      autoMark.hidden = true;
    }
    window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && auto) stopAuto(); });
    window.addEventListener('blur', function () { if (auto) stopAuto(); });

    clockBtn.addEventListener('click', function () { grid.scrollLeft = Math.max(0, px(Math.floor(nowSec() / 1800) * 1800)); });
    if (phone && phone.addEventListener) phone.addEventListener('change', function () { if (CHANNELS.length) render(); });

    function getJSON(url) {
      return fetch(url, { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    }
    function useEpg(j) {
      EPG = j && typeof j === 'object' && j.epg && typeof j.epg === 'object' ? j.epg : {};
    }

    // Logos, names and listings published by the EPG logo dashboard (fine if they're missing)
    var autoReq = getJSON('/imgs/channels/auto/logos.json');
    var epgReq = getJSON('/imgs/channels/auto/epg.json');

    // The channel list comes straight from the /raw/ folder
    fetch('/raw/', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (files) {
        return Promise.all([autoReq, epgReq]).then(function (got) {
          if (got[0] && typeof got[0] === 'object' && got[0].logos && typeof got[0].logos === 'object') AUTO = got[0];
          useEpg(got[1]);
          return files;
        });
      })
      .then(function (files) {
        CHANNELS = files
          .filter(function (f) { return f.type === 'file' && /\.html$/i.test(f.name); })
          .map(function (f) { return f.name.replace(/\.html$/i, ''); })
          .filter(function (n) {
            var hiddenInDashboard = AUTO && Array.isArray(AUTO.hidden) && AUTO.hidden.indexOf(n) !== -1;
            return /^[A-Za-z0-9-][A-Za-z0-9_-]*$/.test(n) && HIDE.indexOf(n) === -1 && !hiddenInDashboard;
          })
          .sort(function (a, b) { return niceName(a).localeCompare(niceName(b)); });
        msg.textContent = CHANNELS.length ? '' : 'No channels yet.';
        render();
        setInterval(tick, 30 * 1000);
        setInterval(function () { getJSON('/imgs/channels/auto/epg.json').then(function (j) { if (j) { useEpg(j); render(); } }); },
          10 * 60 * 1000);
      })
      .catch(function () {
        msg.textContent = "Couldn't load the channel list. Try refreshing the page.";
      });

    search.addEventListener('input', applySearch);
  })();

  // Block right-click and the usual DevTools shortcuts
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'C', 'J'].includes(e.key))) e.preventDefault();
  });
</script>
