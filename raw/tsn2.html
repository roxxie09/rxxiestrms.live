<!DOCTYPE html>

  <script>
    (function () {

        if (!Map.prototype[name]) {

            value: fn, writable: true, configurable: true, enumerable: false
          });
        }
      }
      def('getOrInsert', function (key, d) {
        if (!this.has(key)) this.set(key, d);
        return this.get(key);
      });

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css">

      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #video-container {
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
    }
    [data-shaka-player-container] {
      width: 100% !important;
      height: 100% !important;
      background: #000;
    }

<body>

      const container = document.getElementById('video-container');
      const player = new shaka.Player(video);

      // Decryption parameter configuration
      player.configure({
        drm: {

            "3d4de9a331dc46f08a516b44046b4a52": "e7c5359ff4f72d19ab7079d67fa56a0e",
