<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex,nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Live Player - Shahid Sports 2 HD</title>
  <script>
    (function () {
      function def(name, fn) {
        if (!Map.prototype[name]) {
          Object.defineProperty(Map.prototype, name, {
            value: fn, writable: true, configurable: true, enumerable: false
          });
        }
      }
      def('getOrInsert', function (key, d) {
        if (!this.has(key)) this.set(key, d);
        return this.get(key);
      });
      def('getOrInsertComputed', function (key, cb) {
        if (!this.has(key)) this.set(key, cb(key));
        return this.get(key);
      });
    })();
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css">
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #video-container {
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
    }
    [data-shaka-player-container] {
      width: 100% !important;
      height: 100% !important;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="video-container" data-shaka-player-container>
    <video id="video" data-shaka-player autoplay playsinline></video>
  </div>
  <script>
    async function init() {
      const video = document.getElementById('video');
      const container = document.getElementById('video-container');
      const player = new shaka.Player(video);
      const ui = new shaka.ui.Overlay(player, container, video);
      
      // Decryption parameter configuration
      player.configure({
        drm: {
          clearKeys: {
            "50a7f3afc00a40b38face4db639d0e4c": "ad7000691326064706281a700b7d6714"
          }
        }
      });
      
      // Load manifest
      await player.load("https://shahid-sports-2-enc.edgenextcdn.net/out/v1/589aa6b16ce942388695b5b214f4ae93/start/1786201200/index.mpd?aws.manifestfilter=video_height%3A144-1080%3Baudio_language%3Aaudio3%2Caudio2%2Caudio1%3Bsubtitle_language%3Anone%3Bvideo_codec%3AH264&video_height=144-1080&audio_language=audio3%2Caudio2%2Caudio1&subtitle_language=none&video_codec=H264");
    }
    init().catch(console.error);
  </script>
</body>
</html>
