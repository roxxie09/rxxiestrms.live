<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ESPN / Disney+ Live Player (Direct)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css">
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #video-container { width: 100%; height: 100%; position: fixed; inset: 0; background: #000; }
    video { width: 100%; height: 100%; }
    [data-shaka-player-container] { width: 100% !important; height: 100% !important; background: #000; }
  </style>
</head>
<body>
  <div id="video-container" data-shaka-player-container>
    <video id="video" data-shaka-player autoplay playsinline></video>
  </div>
  <script>
    async function init() {
      shaka.polyfill.installAll();

      const video = document.getElementById('video');
      const container = document.getElementById('video-container');
      const player = new shaka.Player(video);
      const ui = new shaka.ui.Overlay(player, container, video);

      // ClearKey pair extracted from the URL's Base64 'ck' parameter
      player.configure({
        drm: {
          clearKeys: {
            "719092eeb1c14aecb57268bb6a7c225c": "1af69177d91763f991791ef4960756ba"
          }
        }
      });

      // Direct manifest URL
      const manifestUrl = "https://linear-espn-ftc-na-west-1.media.dssott.com/dvt2=exp=1791334136~url=%2Flas1%2Fva01%2Fdisneyplus%2Fchannel%2F2c27a816-4404-4daf-90e0-5cf434e7e0c9-1790786254428%2F~psid=be720965-ad2d-4cef-93af-c6f7a390383a~aid=97fca259-7853-4d4c-8a20-8190b4640166~did=83413b43-2c0b-4a16-8a87-9b336c2eb37f~country=US~kid=k02~hmac=09819284645177309f38fc3a7ba42e02fd3692d39d3588015ca4d0c2efeed862/las1/va01/disneyplus/channel/2c27a816-4404-4daf-90e0-5cf434e7e0c9-1790786254428/ctr-all-hdri-sliding-alt1.m3u8?ab=7500&r=720&v=1&hash=9157e485af6c7c0e428c378c0470604f71d068e1";

      await player.load(manifestUrl);
    }
    init().catch(console.error);
  </script>
</body>
</html>
